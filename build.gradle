plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version "2.3.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
	maven {
		url = "https://repo.essential.gg/repository/maven-public"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mysawitqol" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	implementation(include("gg.essential:elementa:${project.elementaVersion}"))
	modImplementation(include("gg.essential:universalcraft-${project.mcVersion}-fabric:${project.buildNumber}"))

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation("net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.remapJar {
	destinationDirectory.set(file("/home/kujatic/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances/1.21.10/.minecraft/mods/"))
}

tasks.build{
	dependsOn(tasks.remapJar)
}

tasks.runClient {
	dependsOn(tasks.remapJar)
}

java {
	withSourcesJar()

}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
kotlin {
    jvmToolchain(21)
}